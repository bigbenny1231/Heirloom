name: Drill setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployer-account
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Create and fund the drill vault
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
          DRILL_MNEMONIC: ${{ secrets.DRILL_MNEMONIC }}
          HEIR_ADDRESSES: ${{ vars.HEIR_ADDRESSES }}
          QDMV_ADDRESS: ${{ vars.QDMV_ADDRESS }}
          TEST_TOKEN_ADDRESS: ${{ vars.TEST_TOKEN_ADDRESS }}
          QDMV_FROM_BLOCK: ${{ vars.QDMV_FROM_BLOCK }}
          DRILL_QOR: ${{ vars.DRILL_QOR }}
          DRILL_TOKENS: ${{ vars.DRILL_TOKENS }}
          DRILL_KEY_MODE: ${{ vars.DRILL_KEY_MODE }}
          DRILL_ACCOUNT_SHARE_BPS: ${{ vars.DRILL_ACCOUNT_SHARE_BPS }}
        shell: bash
        run: npx tsx scripts/drill/setup.ts | tee drill-setup.log
      - name: Summary
        run: |
          {
            echo '### Drill setup'
            echo '```'
            cat drill-setup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drill-record
          path: deployments/drill.json
