name: Account status
# Shows the deployer's 0x and qor1 addresses, balance, PQC key and EVM window. Run it to find the address to fund.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deployer status
        shell: bash
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: npx tsx scripts/window.ts status | tee status.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Deployer status'
            echo '```'
            cat status.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
