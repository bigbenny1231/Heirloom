name: Drill proof transaction
# Run DURING the drill: Wed Nov 18 00:00-23:59 UTC (Tue Nov 17 7:00 PM to Wed Nov 18 6:59 PM EST). The script refuses outside it.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployer-account
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native self-send from the drill account (hybrid-signed)
        env:
          DRILL_MNEMONIC: ${{ secrets.DRILL_MNEMONIC }}
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        shell: bash
        run: npx tsx scripts/drill/proof-tx.ts | tee proof.log
      - name: Summary
        run: |
          {
            echo '### Proof transaction'
            echo '```'
            cat proof.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
